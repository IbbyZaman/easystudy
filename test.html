<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Animation Player | GCSE Revision Hub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <h1 class="logo">GCSE Revision Hub</h1>
            <ul class="nav-links">
                <li><a href="study.html" class="active">Study</a></li>
                <li><a href="tests.html">Practice Tests</a></li>
                <li><a href="downloads.html">Downloads</a></li>
                <li><a href="login.html" class="btn-login">Login / Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-container">
        <section class="notes-header">
            <h2>Generated Animation Test</h2>
            <p>A self-contained animated player built right into your layout.</p>
        </section>

        <!-- Custom Video Container using an Animated Canvas -->
        <div class="video-container">
            <canvas id="animCanvas" width="800" height="450" style="width: 100%; display: block; background: #0f171e;"></canvas>
            
            <div class="video-controls">
                <button id="playBtn">Pause</button>
                <div class="video-progress" id="progressContainer">
                    <div class="video-progress-filled" id="progressFilled" style="width: 100%;"></div>
                </div>
                <span class="video-time" id="timeDisplay">Animation Loop</span>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 GCSE Revision Hub. Built for students.</p>
    </footer>

    <!-- Canvas Animation & Player Script -->
    <script>
        const canvas = document.getElementById('animCanvas');
        const ctx = canvas.getContext('2d');
        const playBtn = document.getElementById('playBtn');
        const progressFilled = document.getElementById('progressFilled');

        let isPlaying = true;
        let animationId;
        let hue = 0;

        // Floating particles for background effect
        const particles = Array.from({ length: 30 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 3 + 1,
            speedX: (Math.random() - 0.5) * 1,
            speedY: (Math.random() - 0.5) * 1
        }));

        function draw() {
            // Background fade effect
            ctx.fillStyle = 'rgba(15, 23, 30, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update & draw particles
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.fillStyle = 'rgba(52, 152, 219, 0.4)';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Glowing Text Animation
            ctx.save();
            ctx.shadowColor = '#3498db';
            ctx.shadowBlur = 25;
            ctx.font = 'bold 48px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Subtle floating motion for text
            const textY = canvas.height / 2 + Math.sin(Date.now() / 400) * 8;
            
            ctx.fillStyle = '#ffffff';
            ctx.fillText('savemygcses', canvas.width / 2, textY);
            
            ctx.font = '18px "Segoe UI", sans-serif';
            ctx.fillStyle = '#3498db';
            ctx.fillText('Interactive Revision Hub Preview', canvas.width / 2, textY + 60);
            ctx.restore();

            // Progress bar bounce loop effect
            const progressPercent = (Math.sin(Date.now() / 1000) + 1) * 50;
            progressFilled.style.width = `${progressPercent}%`;

            if (isPlaying) {
                animationId = requestAnimationFrame(draw);
            }
        }

        // Play/Pause Control Logic
        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.textContent = 'Pause';
                draw();
            } else {
                playBtn.textContent = 'Play';
                cancelAnimationFrame(animationId);
            }
        });

        // Start the animation loop
        draw();
    </script>
</body>
</html>
